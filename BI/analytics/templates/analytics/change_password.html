{% extends 'analytics/base.html' %}
{% block title %}Change Password — Power BI Studio{% endblock %}

{% block content %}
<style>
.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%);
    padding: 1.5rem;
}

.auth-card {
    background: rgba(30, 41, 59, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 1.45rem;
    font-weight: 800;
    color: #f8fafc;
    margin-bottom: 0.5rem;
}

.auth-brand-logo i {
    color: #00A4EF;
    font-size: 1.6rem;
}

.auth-subtitle {
    font-size: 0.86rem;
    color: #94a3b8;
    line-height: 1.4;
}

.auth-form-group {
    margin-bottom: 1.35rem;
}

.auth-form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 0.45rem;
    letter-spacing: 0.02em;
}

.auth-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.auth-input {
    width: 100%;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 0.75rem 0.95rem;
    color: #f8fafc;
    font-size: 0.92rem;
    outline: none;
    transition: all 0.2s ease;
}

.auth-input:focus {
    border-color: #00A4EF;
    box-shadow: 0 0 0 3px rgba(0, 164, 239, 0.22);
    background: #111d33;
}

.btn-auth-submit {
    width: 100%;
    background: linear-gradient(135deg, #00A4EF 0%, #0078d4 100%);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 0.8rem;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-top: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.btn-auth-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0, 164, 239, 0.45);
}

.auth-error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #f87171;
    padding: 0.75rem 0.95rem;
    border-radius: 8px;
    font-size: 0.84rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.55rem;
}
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-logo">
                <i class="fa-solid fa-key"></i>
                <span>Set New Password</span>
            </div>
            <div class="auth-subtitle">An administrator has requested that you update your password.</div>
        </div>

        {% if error_msg %}
        <div class="auth-error-msg">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error_msg }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'analytics:change_password' %}">
            {% csrf_token %}
            <div class="auth-form-group">
                <label for="new_password"><i class="fa-solid fa-lock"></i> New Password</label>
                <div class="auth-input-wrapper">
                    <input type="password" id="new_password" name="new_password" class="auth-input" placeholder="Enter new password" required minlength="6" autofocus>
                </div>
            </div>

            <div class="auth-form-group">
                <label for="confirm_password"><i class="fa-solid fa-lock"></i> Confirm New Password</label>
                <div class="auth-input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" class="auth-input" placeholder="Re-enter new password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-auth-submit">
                <i class="fa-solid fa-shield-check"></i> Update Password & Proceed
            </button>
        </form>
    </div>
</div>
{% endblock %}
