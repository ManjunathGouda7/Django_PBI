version: '3.8'

services:
  web:
    build: .
    command: python BI/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-dev-key-change-in-production-powerbi-studio
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A BI.celery worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-dev-key-change-in-production-powerbi-studio
    depends_on:
      - redis
