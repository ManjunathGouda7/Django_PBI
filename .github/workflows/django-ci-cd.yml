name: Django Power BI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - name: Check out Repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.txt

    - name: Run Syntax & Code Checks
      run: |
        python -m py_compile BI/manage.py

    - name: Run Django System Checks & Migrations Check
      run: |
        cd BI
        python manage.py check
        python manage.py makemigrations --check --dry-run

    - name: Run Automated Unit Tests
      env:
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd BI
        python manage.py test analytics --verbosity=2

    - name: Build Docker Image Validation
      run: |
        docker build -t powerbi-django:latest .

