name: Apex BI Studio CI/CD Pipeline

on:
  push:
    branches: [ main, Subbranch ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Django System Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Django System Check
        run: |
          python BI/manage.py check

      - name: Run Test Suite
        run: |
          python BI/manage.py test analytics
        env:
          SECRET_KEY: 'ci-secret-key-for-unit-testing-apex-bi'
          DJANGO_ENV: 'development'
          REDIS_URL: 'redis://localhost:6379/0'
